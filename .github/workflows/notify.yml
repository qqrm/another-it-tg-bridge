name: Notify

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # 12:00 Moscow time (UTC+3)

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o another-it-tg-bridge \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/another-it-tg-bridge"
          chmod +x another-it-tg-bridge
      - name: Run bridge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          RUST_LOG: info
        run: ./another-it-tg-bridge
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: update state"
            git push
          fi
