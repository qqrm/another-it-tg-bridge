name: Post

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Restore state cache
        id: state-cache
        uses: actions/cache/restore@v5
        with:
          path: state
          key: another-it-sent-urls-v1-${{ github.run_number }}
          restore-keys: |
            another-it-sent-urls-v1-

      - name: Download binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o another-it-tg-bridge \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/another-it-tg-bridge"
          chmod +x another-it-tg-bridge

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          RUST_LOG: info
        run: ./another-it-tg-bridge

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: another-it-sent-urls-v1-${{ github.run_number }}
