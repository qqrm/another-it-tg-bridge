name: Debug run

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date in YYYY/MM/DD'
        required: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set TARGET_DATE from input
        run: echo "TARGET_DATE=$(date -d '${{ github.event.inputs.date }}' +%Y/%m/%d)" >> "$GITHUB_ENV"

      - name: Download binary from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest -p another-it-tg-bridge -O another-it-tg-bridge
          chmod +x another-it-tg-bridge
          ls -l another-it-tg-bridge
          file another-it-tg-bridge

      - name: Check config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          : "${TELEGRAM_BOT_TOKEN:?missing TELEGRAM_BOT_TOKEN}"
          : "${TELEGRAM_CHAT_ID:?missing TELEGRAM_CHAT_ID}"

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          RUST_LOG: info
        run: |
          echo "TARGET_DATE=$TARGET_DATE"
          ./another-it-tg-bridge
