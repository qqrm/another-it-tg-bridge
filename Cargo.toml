[package]
name = "another-it-tg-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
scraper = "0.24"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
html-escape = "0.2"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
